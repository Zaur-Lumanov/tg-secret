name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the minimum (crypto.argon2Sync), the LTS line, the current line
        node: ["24.7.0", "24", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      # on macOS the build compiles the Touch ID helper: fail if it can't
      - if: runner.os == 'macOS'
        run: node packages/core/scripts/build-touchid.mjs --required
      - run: node scripts/version.mjs
      - name: Pack (dry run)
        shell: bash
        run: for p in core cli cli-alias; do (cd packages/$p && npm pack --dry-run); done
