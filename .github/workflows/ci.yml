name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # the minimum (crypto.argon2Sync), the LTS line, the current line
        node: ["24.7.0", "24", "26"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      # on macOS the build compiles the Touch ID helper: fail if it can't
      - if: runner.os == 'macOS'
        run: node packages/core/scripts/build-touchid.mjs --required
      - run: node scripts/version.mjs
      - name: Pack (dry run)
        shell: bash
        run: for p in core cli cli-alias; do (cd packages/$p && npm pack --dry-run); done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov takes the upload without a token, by the workflow's OIDC identity
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g yarn@1.22.22
      - run: yarn install --frozen-lockfile
      - run: yarn coverage
      # lcov paths are relative to each package; make them relative to the repository
      - run: |
          sed -i 's#^SF:#SF:packages/core/#' packages/core/coverage/lcov.info
          sed -i 's#^SF:#SF:packages/cli/#' packages/cli/coverage/lcov.info
      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: packages/core/coverage/lcov.info,packages/cli/coverage/lcov.info
          # until the repository is connected on codecov.io, a failed upload doesn't fail CI
          fail_ci_if_error: false
