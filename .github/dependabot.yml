version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # our own packages, linked by the workspace
      - dependency-name: "tg-secret*"
    groups:
      # one PR for all minor and patch updates; majors come one by one
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
